name: Build Linux

on:
  push:
    branches: [ main, master, develop, mobile ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, master, develop, mobile ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for Ubuntu (AppImage & DEB)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          libgdk-pixbuf2.0-dev \
          libpango1.0-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libjavascriptcoregtk-4.1-dev

    - name: Rust cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Show build environment info
      run: |
        echo "=== Build Environment Information ==="
        echo "Ubuntu version: $(lsb_release -d | cut -f2)"
        echo "Node.js version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Rust version: $(rustc --version)"
        echo "Cargo version: $(cargo --version)"
        echo "Available disk space: $(df -h . | tail -1 | awk '{print $4}')"
        echo "Memory: $(free -h | grep '^Mem:' | awk '{print $3"/"$2}')"
        echo "========================================"

    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend
      run: npx vite build --mode production

    - name: Build Tauri app for Linux
      run: npm run tauri build

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          src-tauri/target/release/bundle/deb/*.deb
          src-tauri/target/release/bundle/appimage/*.AppImage
          src-tauri/target/release/patient-management-app
        retention-days: 30

    - name: Display build artifacts info
      run: |
        echo "=== Ubuntu Build Summary ==="
        echo "✅ Linux build completed successfully!"
        echo "📦 Build artifacts uploaded to GitHub Actions"
        echo ""
        echo "Generated files:"
        find src-tauri/target/release/bundle -name "*.deb" -exec echo "🟦 DEB: {}" \; | head -5
        find src-tauri/target/release/bundle -name "*.AppImage" -exec echo "🟨 AppImage: {}" \; | head -5
        if [ -f "src-tauri/target/release/patient-management-app" ]; then
          echo "🟩 Binary: src-tauri/target/release/patient-management-app"
        fi
        echo ""
        echo "📊 File sizes:"
        find src-tauri/target/release/bundle -name "*.deb" -exec ls -lh {} \; | awk '{print "DEB: " $5 " " $9}'
        find src-tauri/target/release/bundle -name "*.AppImage" -exec ls -lh {} \; | awk '{print "AppImage: " $5 " " $9}'
        echo "========================="